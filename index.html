<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>축우 현장점검</title>
<meta name="theme-color" content="#16324a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 모바일 우선 단일 컬럼 + 하단 탭바. 현장(장갑·햇빛)에서 큰 터치 타깃, 높은 대비 */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#16232e; --muted:#5d6b75; --line:#d9e0e3;
  --accent:#16324a; --accent-2:#2f6f8f; --accent-ink:#ffffff;
  --good:#2e7d4f; --good-bg:#e3f2e8; --warn:#a86a00; --warn-bg:#fbf0d9; --bad:#b3352b; --bad-bg:#f8e2df; --na:#8a959c;
  --font:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161b; --surface:#172129; --ink:#e6edf0; --muted:#9aa8b0; --line:#2a3842;
  --accent:#8cc3e0; --accent-2:#6fb0d0; --accent-ink:#0b1a24;
  --good:#6fcf97; --good-bg:#16301f; --warn:#f0b54a; --warn-bg:#352a12; --bad:#ff8a7d; --bad-bg:#3a1c19; --na:#7b878e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161b; --surface:#172129; --ink:#e6edf0; --muted:#9aa8b0; --line:#2a3842;
  --accent:#8cc3e0; --accent-2:#6fb0d0; --accent-ink:#0b1a24;
  --good:#6fcf97; --good-bg:#16301f; --warn:#f0b54a; --warn-bg:#352a12; --bad:#ff8a7d; --bad-bg:#3a1c19; --na:#7b878e; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:15px/1.5 var(--font);-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
.wrap{max-width:760px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-ink);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
header.top .wrap{display:flex;align-items:center;gap:12px}
header.top h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .score{font:600 15px var(--mono);font-variant-numeric:tabular-nums;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.14)}
:root[data-theme="dark"] header.top .score{background:rgba(0,0,0,.12)}
h2{font-size:19px;margin:22px 0 8px;text-wrap:balance}
h3{font-size:15px;margin:0;font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px;width:100%}
textarea{min-height:64px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:44px;padding:8px 14px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent}
button.danger{color:var(--bad);border-color:var(--bad)}
.banner{border:1px dashed var(--warn);background:var(--warn-bg);color:var(--ink);border-radius:var(--r);padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.banner b{color:var(--warn)}
/* 탭바 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:12px;color:var(--muted);min-height:52px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-selected="true"]{color:var(--accent);font-weight:700}
/* CCCS 항목 */
.sec{margin-top:14px}
.sec-head{display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer;border:0;background:none;width:100%;text-align:left;min-height:auto}
.sec-head .code{font:600 13px var(--mono);color:var(--accent-2);width:22px}
.sec-head h3{flex:1}
.meter{height:6px;border-radius:99px;background:var(--line);overflow:hidden;width:72px}
.meter i{display:block;height:100%;background:var(--good)}
.pct{font:600 13px var(--mono);font-variant-numeric:tabular-nums;width:44px;text-align:right}
.item{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:8px}
.item:first-child{border-top:0}
.item .q{font-weight:500}
.item .std{font-size:12.5px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{min-height:44px;padding:6px 4px;font-size:14px}
.seg button[data-v="2"][aria-pressed="true"]{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
.seg button[data-v="1"][aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn);font-weight:700}
.seg button[data-v="0"][aria-pressed="true"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:700}
.seg button[data-v="-1"][aria-pressed="true"]{background:var(--line);color:var(--ink);font-weight:700}
.memo{font-size:14px;min-height:40px;padding:8px}
/* 카우시그널 */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips button{white-space:nowrap;border-radius:99px;min-height:40px;padding:6px 14px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.ind-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tally{display:grid;gap:6px;margin-top:10px}
.tally button{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 2px;min-height:62px;position:relative}
.tally button .lb{font-size:13px;color:var(--muted)}
.tally button .ct{font:600 20px var(--mono);font-variant-numeric:tabular-nums}
.tally button.isbad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.tally button.isbad .lb{color:var(--bad)}
.tally button.flash{background:var(--good-bg)}
.minus-on .tally button{border-style:dashed}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.na{background:var(--line);color:var(--muted)}
.toolbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 50px);z-index:4;background:var(--bg);padding:8px 0;display:flex;flex-direction:column;gap:8px}
.switch{display:flex;align-items:center;gap:8px;font-size:14px}
.switch input{width:22px;height:22px;min-height:auto}
.num-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
/* 리포트 */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary .stat{min-width:0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat .v{font:600 24px var(--mono);font-variant-numeric:tabular-nums}
.stat .k{font-size:12.5px;color:var(--muted)}
.finding{display:grid;grid-template-columns:6px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.finding:first-child{border-top:0}
.finding .bar{border-radius:3px}
.finding.p1 .bar{background:var(--bad)} .finding.p2 .bar{background:var(--warn)} .finding.p3 .bar{background:var(--accent-2)}
.finding .t{font-weight:600}
.finding .a{font-size:13.5px;color:var(--muted)}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
table.t td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:90vw}
pre.copy{white-space:pre-wrap;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:260px;overflow:auto}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.src{font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.src.k{background:color-mix(in srgb,var(--accent-2) 16%,transparent);color:var(--accent-2)}
.src.l{background:var(--line);color:var(--muted)}
.valrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.valrow input{width:130px;flex:0 0 auto}
.valrow input.txt{flex:1 1 200px;width:auto}
.valrow .u{font-size:13px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{min-height:40px;padding:6px 10px;font-size:13.5px}
.opts button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.opts button .p{font-family:var(--mono);opacity:.75;margin-left:4px}
.signs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
@media (max-width:380px){.signs{grid-template-columns:1fr}}
.signs button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;min-height:52px;padding:6px 10px;font-size:13px;line-height:1.3}
.signs button .ct{font:600 18px var(--mono);min-width:22px;text-align:right}
.signs button.on{border-color:var(--warn);background:var(--warn-bg)}
.calc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:4px}
.calc .stat .v{font-size:19px}
nav.tabs .wrap{grid-template-columns:repeat(5,1fr)}
nav.tabs button{font-size:11.5px}
details.why{font-size:13px;color:var(--muted);border-left:3px solid color-mix(in srgb,var(--accent-2) 40%,var(--line));padding:2px 0 2px 10px}
details.why summary{cursor:pointer;color:var(--accent-2);font-weight:600;list-style:none;min-height:28px;display:flex;align-items:center}
details.why summary::-webkit-details-marker{display:none}
details.why summary::before{content:"＋";margin-right:6px;font-weight:700}
details.why[open] summary::before{content:"－"}
details.why div{color:var(--ink);line-height:1.6;padding:2px 0 4px}
.hbtn{min-height:36px;min-width:36px;padding:0 10px;border-radius:99px;border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--accent-ink);font-weight:700}
.help h2{margin-top:26px}
.help h3{margin:16px 0 6px}
.help p,.help li{line-height:1.7;max-width:68ch}
.help ol,.help ul{padding-left:20px;margin:6px 0}
.help table.t td,.help table.t th{white-space:normal}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc a{font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;color:var(--ink);text-decoration:none;background:var(--surface)}
.why-item{padding:10px 0;border-top:1px solid var(--line)}
.why-item:first-child{border-top:0}
.why-item .q{font-weight:600}
.why-item .std{font-size:12.5px;color:var(--muted)}
.why-item .w{font-size:13.5px;line-height:1.65;margin-top:4px}
body.gated nav.tabs, body.gated .hbtn{display:none}
.gate{text-align:center;padding:48px 8px 24px;max-width:520px;margin:0 auto}
.gate p{color:var(--muted);line-height:1.7}
.gate-icon{width:56px;height:56px;border-radius:99px;margin:0 auto 8px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px}
header.top .score:empty{display:none}
.badge{position:absolute;top:2px;right:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:99px;font-size:10px;min-width:16px;height:16px;line-height:16px;padding:0 4px;font-weight:700}
nav.tabs button{position:relative}
</style>
</head>

    run(code,pendingInfo)}
});
main.addEventListener("input",e=>{if(e.target.id==="s_key"){const k=$("#klen");if(k)k.textContent=cleanKey(e.target.value).length+"자 / 44자"}});
main.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"){const b=main.querySelector(".primary[data-s]");if(b)b.click()}});
let pendingInfo=null;
async function syncId(id,u){/* 아이디 → 이메일 연결 정보 유지 (예전 계정 포함). 실패하면 오류 코드를 돌려줌 */
  try{const x=await idDoc(id), real=isFake(u.email)?null:u.email;
    if(!x)await db.doc("ids/"+id).set({uid:u.uid,email:real});
    else if(x.uid===u.uid&&(x.email||null)!==real)await db.doc("ids/"+id).set({uid:u.uid,email:real});
    return null}catch(e){return e&&e.code||"error"}
}
async function route(u){
  if(!u){view==="signup"?signupView():view==="forgot"?forgotView():loginView();return}
  box("권한 확인 중","잠시만 기다려 주세요.");
  let adm=await idDoc(ADMIN_ID);
  if(!adm&&u.email===fake(ADMIN_ID)){const er=await syncId(ADMIN_ID,u);adm=await idDoc(ADMIN_ID);
    if(!adm)return box("관리자 연결을 만들지 못했습니다","Firebase 콘솔 → Firestore Database → 규칙 탭에 <b>match /ids/{id}</b> 부분이 있는 최신 규칙이 게시되어 있는지 확인해 주세요. 게시 후 1~2분 뒤 새로고침하면 됩니다. (오류: "+esc(er||"없음")+")",logoutBtn)}
  if(adm&&adm.uid!==u.uid&&u.email===fake(ADMIN_ID))return box("관리자 연결이 다른 계정에 있습니다","관리자 계정을 지웠다가 다시 만든 경우입니다. Firebase 콘솔 → Firestore Database → 데이터에서 <b>ids</b> 안의 <b>admin</b> 문서를 삭제한 뒤 새로고침해 주세요.",logoutBtn);
  if(adm&&adm.uid===u.uid){syncId(ADMIN_ID,u);return loadKey({uid:u.uid,id:ADMIN_ID,name:"관리자",isAdmin:true,email:isFake(u.email)?null:u.email})}
  if(unsub)unsub();
  unsub=db.doc("users/"+u.uid).onSnapshot(d=>{
    if(!d.exists){if(creating)return;return box("가입 정보가 없습니다","가입 신청을 다시 해 주세요. 계속 안 되면 관리자에게 문의하세요.",logoutBtn)}
    const x=d.data(), id=x.id||(u.email||"").split("@")[0]; syncId(id,u);
    if(x.status==="approved"){unsub();unsub=null;return loadKey({uid:u.uid,id,name:x.name||id,isAdmin:false,email:isFake(u.email)?null:u.email})}
    if(x.status==="blocked")return box("사용이 중지되었습니다","관리자가 이 아이디의 사용을 중지했습니다. 관리자에게 문의하세요.",logoutBtn);
    if(x.status==="rejected")return box("가입이 승인되지 않았습니다","관리자에게 문의하세요.",logoutBtn);
    box("승인 대기 중",esc(x.name||id)+"님("+esc(id)+")의 가입 신청을 보냈습니다. 관리자가 승인하면 이 화면이 자동으로 열립니다.",logoutBtn);
  },err=>box("권한을 확인하지 못했습니다","잠시 후 새로고침해 주세요. ("+esc(err.code||"")+")",logoutBtn));
}
auth.onAuthStateChanged(u=>{if(creating)return;route(u)});
const cleanKey=v=>String(v||"").replace(/[\s"'\x60“”‘’]/g,"").replace(/-/g,"+").replace(/_/g,"/");
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(k){const key=await crypto.subtle.importKey("raw",b64(k),"AES-GCM",false,["decrypt"]);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(ENC));return new TextDecoder().decode(pt)}
async function loadKey(info){
  box("앱을 여는 중","잠시만 기다려 주세요.");pendingInfo=info;
  let k=null;try{const d=await db.doc("secrets/content").get();if(d.exists)k=d.data().k}catch(e){}
  if(k){const code=await decrypt(k).catch(()=>null);if(code)return run(code,info)}
  if(info.isAdmin)return box("앱 키 등록","처음 한 번만 관리자가 앱 키를 등록합니다. 받은 앱 키 파일(farmcheck_app_key.txt) 안의 한 줄(44자)을 붙여넣으세요.",card('<label class="f">앱 키<textarea id="s_key" rows="2" autocomplete="off" autocapitalize="off" spellcheck="false" style="font-family:var(--mono);min-height:60px" placeholder="예: Ab3+xY...="></textarea></label><div class="small muted" id="klen">0자 / 44자</div>'+'<button class="primary" data-s="key">등록하고 시작</button>'+msgEl)+logoutBtn);
  box("앱 준비 중","관리자가 아직 앱 설정을 마치지 않았습니다. 잠시 후 다시 열어 주세요.",logoutBtn);
}
/* 앱(복호화된 코드)에 넘기는 계정 기능: 비밀번호 변경, 비밀번호 찾기용 이메일 등록 */
const account={
  email:()=>{const u=auth.currentUser;return u&&!isFake(u.email)?u.email:null},
  async reauth(pw){const u=auth.currentUser;await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,pw))},
  async changePassword(cur,np){await account.reauth(cur);await auth.currentUser.updatePassword(np)},
  async setEmail(cur,mail,id){await account.reauth(cur);await auth.currentUser.verifyBeforeUpdateEmail(mail);
    const u=auth.currentUser;try{await db.doc("ids/"+id).set({uid:u.uid,email:isFake(u.email)?null:u.email,pending:mail})}catch(e){}}
};
function run(code,info){
  window.FB={uid:info.uid,id:info.id,name:info.name,isAdmin:info.isAdmin,db,account,logout:()=>auth.signOut().then(()=>location.reload())};
  document.body.classList.remove("gated");main.innerHTML="";
  const s=document.createElement("script");s.textContent=code;document.body.appendChild(s);
}
})();
</script>
